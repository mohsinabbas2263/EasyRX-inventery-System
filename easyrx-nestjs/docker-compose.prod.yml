version: '3.8'

services:
  app:
    build: .
    container_name: easyrx-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=easy123
      - DATABASE_NAME=easyrx
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      # Rate Limiting
      - THROTTLE_TTL=60
      - THROTTLE_LIMIT=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - easyrx-network

  postgres:
    image: postgres:16-alpine
    container_name: easyrx-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=easy123
      - POSTGRES_DB=easyrx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - easyrx-network

  redis:
    image: redis:7-alpine
    container_name: easyrx-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - easyrx-network

volumes:
  postgres_data:
  redis_data:

networks:
  easyrx-network:
    driver: bridge
